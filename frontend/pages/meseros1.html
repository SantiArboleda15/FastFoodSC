<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comanda Digital — Fast Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/meseros.css?v=2">
</head>
<body class="text-white min-h-screen flex flex-col">

    <!-- ─── HEADER ─── -->
    <header class="w-full bg-gray-900/80 backdrop-blur-md border-b border-gray-800 px-4 py-3 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-navy-900 flex items-center justify-center text-white text-sm font-black flex-shrink-0" id="user-avatar-letter">
                    M
                </div>
                <div>
                    <p class="text-navy-400 font-bold text-[9px] uppercase tracking-widest leading-none">
                        Mesero Activo
                    </p>
                    <p id="userName" class="text-white font-black text-sm leading-tight mt-0.5">
                        Cargando...
                    </p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Pedidos en cola (badge) -->
                <div id="orders-in-queue" class="hidden items-center gap-1.5 bg-amber-500/10 border border-amber-500/30 text-amber-400 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">
                    <span class="animate-pulse">●</span>
                    <span id="queue-count">0</span> en cocina
                </div>
                <a href="roles1.html"
                   class="bg-gray-800 hover:bg-red-900/40 text-gray-400 hover:text-red-400
                          px-3 py-2 rounded-lg text-[10px] font-black uppercase transition-all border border-gray-700">
                    ← Rol
                </a>
            </div>
        </div>
    </header>

    <!-- ─── MAIN ─── -->
    <main class="flex-1 max-w-6xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-5 p-4">

        <!-- ── COLUMNA IZQUIERDA: MENÚ ── -->
        <div class="lg:col-span-2">

            <!-- Hero / Filtros + Mesa -->
            <div class="kfc-hero flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h2 class="font-black uppercase text-2xl tracking-tight text-navy-900"
                          style="font-family:'Inter',sans-serif;letter-spacing:0.03em;">
                        🍗 Nuestro Menú
                    </h2>
                    <p class="text-navy-500 text-xs font-semibold mt-0.5">Selecciona tus favoritos</p>
                </div>
                <div class="flex items-center gap-3">
                    <!-- Categorías scroll horizontal -->
                    <div class="flex gap-2 overflow-x-auto pb-1" style="scrollbar-width:none;-ms-overflow-style:none;">
                        <button class="cat-pill active" onclick="filterCat('all',this)">Todo</button>
                        <button class="cat-pill" onclick="filterCat('combo',this)">Combos</button>
                        <button class="cat-pill" onclick="filterCat('pollo',this)">Pollo</button>
                        <button class="cat-pill" onclick="filterCat('burger',this)">Burgers</button>
                        <button class="cat-pill" onclick="filterCat('extra',this)">Extras</button>
                    </div>
                    <select id="mesa"
                            class="bg-white/70 border border-gray-300/60 text-gray-900 text-xs rounded-xl
                                   px-3 py-2.5 outline-none focus:ring-2 focus:ring-navy-500 font-bold backdrop-blur-sm">
                        <option value="Mesa 1">🪑 Mesa 1</option>
                        <option value="Mesa 2">🪑 Mesa 2</option>
                        <option value="Mesa 3">🪑 Mesa 3</option>
                        <option value="Mesa 4">🪑 Mesa 4</option>
                        <option value="Mesa 5">🪑 Mesa 5</option>
                        <option value="Para Llevar">📦 Para Llevar</option>
                        <option value="Domicilio">🛵 Domicilio</option>
                    </select>
                </div>
            </div>

            <!-- Grid de Menú -->
            <div id="contenedor-menu"
                 class="grid grid-cols-1 sm:grid-cols-2 gap-4"
                 style="max-height: calc(100vh - 220px); overflow-y: auto; padding-right: 4px;">
                <!-- Ítems se renderizan por JS -->
            </div>

        </div>

        <!-- ── COLUMNA DERECHA: CARRITO GLASS AZUL ── -->
        <div class="lg:col-span-1">
            <div class="cart-panel flex flex-col" style="max-height: calc(100vh - 100px);">

                <!-- Header glass azul del carrito -->
                <div class="cart-header flex justify-between items-center">
                    <div>
                        <h2>🛒 TU PEDIDO</h2>
                        <p id="mesa-display" class="text-navy-400 text-[10px] font-bold mt-0.5 uppercase tracking-wider">Mesa 1</p>
                    </div>
                    <span id="item-count"
                          class="w-8 h-8 bg-amber-500/30 rounded-full text-amber-400 text-xs font-black
                                   flex items-center justify-center flex-shrink-0 backdrop-blur-sm border border-amber-400/30">
                        0
                    </span>
                </div>

                <!-- Lista de ítems -->
                <div id="lista-seleccionada"
                     class="flex-1 overflow-y-auto p-3 cart-scroll"
                     style="min-height: 120px;">
                </div>

                <!-- Notas -->
                <div class="px-3 pb-2">
                    <textarea id="observaciones"
                        placeholder="📝 Notas: sin cebolla, término medio..."
                        class="w-full bg-white/50 border border-gray-300/50 rounded-xl p-2.5 text-xs
                               text-navy-900 focus:ring-2 focus:ring-navy-500 outline-none resize-none
                               placeholder-gray-400 backdrop-blur-sm"
                        rows="2">
                    </textarea>
                </div>

                <!-- Total + Botón -->
                <div class="cart-total-bar">
                    <div class="flex justify-between items-baseline mb-3">
                        <span class="text-xs text-navy-600 uppercase font-black tracking-wider">Total</span>
                        <span id="total-precio" class="total-price">
                            $0
                        </span>
                    </div>
                    <button id="btn-enviar" onclick="submitOrder()"
                            class="btn-primary w-full mt-2">
                        🚀 Confirmar Pedido
                    </button>
                    <button onclick="clearOrder()
                                class="w-full mt-2 text-[10px] text-navy-500 hover:text-navy-700 uppercase font-black
                                       transition-colors py-1">
                        Vaciar Pedido
                    </button>
                </div>

            </div>
        </div>

    </main>

    <script src="../assets/js/registro.js"></script>
    <script>
        // ─── PRODUCTOS DEMO (se cargan desde la API) ───
        let menuData = [];
        let currentFilter = 'all';
        let cart = [];

        async function loadProducts() {
            const container = document.getElementById('contenedor-menu');
            if (container) {
                container.innerHTML = '<p class="text-navy-500 text-sm text-center py-8">Cargando productos DEMO...</p>';
            }

            try {
                const res = await fetch('../api.php?action=get_products', { cache: 'no-store' });
                const data = await res.json();
                menuData = Array.isArray(data) ? data : (data.data || []);
                renderMenu(currentFilter);
            } catch (e) {
                if (container) {
                    container.innerHTML = '<p class="text-red-500 text-sm text-center py-8">No se pudieron cargar los productos.</p>';
                }
            }
        }

        // ─── RENDERIZAR MENÚ ───
        function renderMenu(filter = 'all') {
            const container = document.getElementById('contenedor-menu');
            container.innerHTML = '';

            const items = filter === 'all' ? menuData : menuData.filter(m => m.categoria === filter);

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'kfc-card';
                card.innerHTML = `
                    <div style="overflow:hidden;border-radius:1.25rem 1.25rem 0 0;">
                        <img src="${item.imagen}" alt="${item.nombre}" class="card-img" loading="lazy">
                    </div>
                    <div class="card-body">
                        <div class="flex justify-between items-start gap-2">
                            <div class="flex-1 min-w-0">
                                <h3 class="card-title">${item.nombre}</h3>
                                <p class="card-desc">${item.descripcion}</p>
                            </div>
                        </div>
                        <div class="flex justify-between items-center mt-3">
                            <span class="card-price">$${item.precio}</span>
                            <button class="add-btn" onclick="addToCart(${item.id})" title="Agregar">
                                +
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ─── FILTRAR CATEGORÍA ───
        function filterCat(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            renderMenu(currentFilter);
        }

        // ─── AGREGAR AL CARRITO ───
        function addToCart(id) {
            const item = menuData.find(m => m.id === id);
            const existing = cart.find(c => c.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            renderCart();
        }

        // ─── CAMBIAR CANTIDAD ───
        function changeQty(id, delta) {
            const item = cart.find(c => c.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(c => c.id !== id);
            }
            renderCart();
        }

        // ─── RENDERIZAR CARRITO ───
        function renderCart() {
            const list = document.getElementById('lista-seleccionada');
            const countBadge = document.getElementById('item-count');
            const totalEl = document.getElementById('total-precio');

            const totalQty = cart.reduce((sum, c) => sum + c.qty, 0);
            const totalPrice = cart.reduce((sum, c) => sum + (c.precio * c.qty), 0);

            countBadge.textContent = totalQty;
            totalEl.textContent = '$' + totalPrice.toLocaleString();

            if (cart.length === 0) {
                list.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-8 text-navy-400">
                        <svg class="w-10 h-10 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                        <p class="text-xs font-bold uppercase tracking-wider">Tu carrito está vacío</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = cart.map(item => `
                <div class="cart-item flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg overflow-hidden flex-shrink-0 bg-gray-100/50 backdrop-blur-sm">
                        <img src="${item.imagen}" class="w-full h-full object-cover" alt="">
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-black text-navy-900 truncate">${item.nombre}</p>
                        <p class="text-[10px] text-navy-500 font-bold">$${item.precio} c/u</p>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button class="cart-qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
                        <span class="text-xs font-black text-navy-900 w-4 text-center">${item.qty}</span>
                        <button class="cart-qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        // ─── VACIAR PEDIDO ───
        function clearOrder() {
            cart = [];
            renderCart();
        }

        // ─── ENVIAR PEDIDO ───
        async function submitOrder() {
            // --- Verificar que haya una sesión PHP activa ---
            const session = localStorage.getItem('ff_session');
            if (!session) {
                alert('Sesión expirada. Por favor, vuelve a iniciar sesión.');
                window.location.href = 'index.html';
                return;
            }

            if (cart.length === 0) {
                alert('Agrega productos al carrito primero');
                return;
            }

            const btn = document.getElementById('btn-enviar');
            if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }

            const mesa = document.getElementById('mesa')?.value || 'General';

            // No se envía el campo mesero desde el frontend; el backend
            // lo asignará usando la sesión PHP autenticada.
            const ticket = {
                mesa,
                items:     cart,
                notas:     document.getElementById('observaciones')?.value.trim() || '',
                hora:      new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                estado:    'pendiente',
                timestamp: Date.now()
            };

            try {
                const res  = await fetch('../api.php?action=submit_order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ticket)
                });
                const data = await res.json();

                if (data.success) {
                    alert(`¡Pedido #${data.numero} enviado a cocina!`);
                    clearOrder();
                } else {
                    alert(data.error || 'Error al enviar el pedido');
                }
            } catch (e) {
                alert('Error de conexión con el servidor. Verifica que el servidor PHP esté activo (php -S localhost:8000).');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '🚀 Confirmar Pedido'; }
            }
        }

        // ─── INICIALIZAR ───
        loadProducts();
        renderCart();

        // Sincronizar nombre de mesa en el ticket
        document.getElementById('mesa')?.addEventListener('change', function() {
            const display = document.getElementById('mesa-display');
            if (display) display.textContent = this.value;
        });

        // Mostrar pedidos activos en cocina
        async function updateQueueBadge() {
            const badge = document.getElementById('orders-in-queue');
            const queueCount = document.getElementById('queue-count');
            if (!badge) return;

            try {
                const res = await fetch('../api.php?action=get_orders&estado=activos', { cache: 'no-store' });
                const orders = await res.json();
                const total = Array.isArray(orders) ? orders.length : 0;

                if (total > 0) {
                    badge.classList.remove('hidden');
                    badge.classList.add('flex');
                    if (queueCount) queueCount.textContent = total;
                } else {
                    badge.classList.add('hidden');
                    badge.classList.remove('flex');
                }
            } catch (e) {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }
        }

        updateQueueBadge();
        setInterval(updateQueueBadge, 3000);

        // Avatar del usuario
        const session = localStorage.getItem('ff_session') || localStorage.getItem('usuario');
        const avatarLetter = document.getElementById('user-avatar-letter');
        if (session && avatarLetter) avatarLetter.textContent = session.charAt(0).toUpperCase();
    </script>
</body>
</html>
